<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0C1024;
    --night-ink: #F3E6C4;
    --lit-bg: #E9DAB4;
    --lit-ink: #2B1A12;
    --paper: #F7EDD3;
    --accent: #8C1C2C;
    --gold: #C9982F;
    --flame: #FFB627;
    --pewter: #9AA3B5;
    --cake1: #8C1C2C;
    --cake2: #D9A93A;
    --cake3: #F6EAD0;
    --display: "Cinzel Decorative", "Trajan Pro", Georgia, "Times New Roman", serif;
    --body: "IM Fell English", Georgia, "Times New Roman", serif;
    --bg: var(--night);
    --ink: var(--night-ink);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root.lit { --bg: var(--lit-bg); --ink: var(--lit-ink); }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 1.2rem;
    line-height: 1.6;
    transition: background-color 1.6s ease, color 1.6s ease;
  }
  :focus-visible { outline: 3px solid var(--flame); outline-offset: 4px; }

  /* ---------- Opening: candlelit hall ---------- */
  .stage {
    position: relative;
    overflow: hidden;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    text-align: center;
    padding: 3rem max(1.25rem, env(safe-area-inset-right, 0px)) 2rem max(1.25rem, env(safe-area-inset-left, 0px));
  }
  .stage > *:not(.ceiling) { position: relative; z-index: 1; }
  #title {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(2rem, 8.5vw, 3.6rem);
    line-height: 1.15;
    margin: 0;
    text-wrap: balance;
  }

  .ceiling { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
  .fc {
    position: absolute;
    width: 12px;
    height: 64px;
    scale: var(--s, 1);
    transform-origin: 50% 100%;
    animation: float var(--dur, 7s) ease-in-out infinite;
    animation-delay: var(--del, 0s);
  }
  .fc::after {
    content: "";
    position: absolute; left: 0; bottom: 0;
    width: 12px; height: 42px;
    background: #F3E6C4;
    border-radius: 3px 3px 2px 2px;
  }
  .fc i {
    position: absolute; left: 50%; top: 6px;
    width: 9px; height: 18px; margin-left: -4.5px;
    background: var(--flame);
    border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
    box-shadow: 0 0 16px 7px rgba(255, 182, 39, .45);
    transform-origin: 50% 100%;
    animation: flicker 1.4s ease-in-out infinite;
    transition: box-shadow 1.6s ease;
  }
  :root.lit .fc i { box-shadow: 0 0 8px 3px rgba(255, 182, 39, .3); }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-12px) rotate(2deg); }
  }

  .cake {
    background: none; border: 0; padding: 0; margin: 0;
    width: min(78vw, 340px);
    cursor: pointer;
    display: block;
    border-radius: 24px;
    -webkit-tap-highlight-color: transparent;
    color: inherit;
  }
  .cake svg { width: 100%; height: auto; display: block; overflow: visible; }
  .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 1.6s ease-in-out infinite; transition: opacity .25s ease; }
  .glow { transition: opacity .4s ease; }
  :root.lit #cake .flame, :root.lit #cake .glow { opacity: 0; }
  .smoke { opacity: 0; fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
  :root.lit .smoke { animation: smoke 2s ease-out forwards; }
  @keyframes flicker {
    0%, 100% { transform: scale(1, 1) rotate(-1deg); }
    35% { transform: scale(.94, 1.06) rotate(1.5deg); }
    70% { transform: scale(1.04, .96) rotate(-1deg); }
  }
  @keyframes smoke {
    0% { opacity: .6; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-26px); }
  }

  /* ---------- After the candles ---------- */
  #reveal { opacity: 0; transition: opacity 1.6s ease .6s; }
  #reveal[hidden] { display: none; }
  #reveal.in { opacity: 1; }
  .wrap {
    max-width: 38rem;
    margin: 0 auto;
    padding-left: max(1.25rem, env(safe-area-inset-left, 0px));
    padding-right: max(1.25rem, env(safe-area-inset-right, 0px));
  }
  .block { padding-top: clamp(3rem, 9vw, 5.5rem); padding-bottom: clamp(1.5rem, 5vw, 3rem); }
  h2 {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(1.5rem, 6vw, 2.2rem);
    line-height: 1.2;
    margin: 0 0 2.25rem;
    text-wrap: balance;
  }

  /* ---------- Memory lane ---------- */
  .lane {
    list-style: none;
    margin: 0;
    padding: 0;
    position: relative;
  }
  .lane::before {
    content: "";
    position: absolute;
    top: 0; bottom: 0; left: 10px;
    border-left: 3px dashed var(--accent);
  }
  .lane li {
    position: relative;
    padding: 0 0 3.75rem 2.75rem;
    opacity: 0;
    transform: translateY(26px);
    transition: opacity .9s ease, transform .9s ease;
  }
  .lane li.seen { opacity: 1; transform: none; }
  .lane li::before {
    content: "";
    position: absolute;
    left: 0; top: .3rem;
    width: 23px; height: 23px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 0 5px var(--bg);
  }
  .when { display: block; font-family: var(--display); font-weight: 400; font-size: .95rem; color: var(--accent); margin-bottom: .15rem; }
  .lane h3 { font-family: var(--display); font-weight: 700; font-size: 1.3rem; line-height: 1.25; margin: 0 0 .4rem; }
  .lane p { margin: 0; }
  .pola {
    background: var(--paper);
    padding: .6rem;
    border-radius: 3px;
    box-shadow: 0 8px 22px rgba(20, 8, 4, .25);
    max-width: 20rem;
    margin: .9rem 0 1.1rem;
    transform: rotate(-1.5deg);
  }
  .lane li:nth-child(even) .pola { transform: rotate(1.5deg); }

  .frame {
    aspect-ratio: 4 / 5;
    display: grid;
    place-items: center;
    text-align: center;
    padding: .75rem;
    font-size: .95rem;
    line-height: 1.3;
    background: var(--lit-bg);
    border: 2px dashed var(--accent);
    color: var(--ink);
  }
  .frame.has-photo { padding: 0; border: 0; }
  .frame img { width: 100%; height: 100%; object-fit: cover; display: block; }

  @media (min-width: 52rem) {
    .wrap { max-width: 52rem; }
    .lane::before { left: 50%; margin-left: -1.5px; }
    .lane li { width: 50%; padding: 0 3rem 4rem 0; text-align: right; }
    .lane li::before { left: auto; right: -11.5px; }
    .lane li:nth-child(even) { margin-left: 50%; padding: 0 0 4rem 3rem; text-align: left; }
    .lane li:nth-child(even)::before { right: auto; left: -11.5px; }
    .lane li:nth-child(odd) .pola { margin-left: auto; }
  }

  /* ---------- Paragraph on parchment ---------- */
  .letter {
    position: relative;
    background: var(--paper);
    padding: 2rem 1.6rem 3.4rem;
    border-radius: 4px;
    box-shadow: 0 8px 22px rgba(20, 8, 4, .25);
    max-width: 38rem;
    margin: 0 auto;
  }
  .letter p { margin: 0; white-space: pre-line; font-style: italic; font-size: 1.25rem; color: var(--lit-ink); }
  .seal {
    position: absolute;
    left: 50%; bottom: -1.7rem;
    transform: translateX(-50%);
    width: 3.4rem; height: 3.4rem;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #B3273B, #7A1524);
    color: #F3E6C4;
    display: grid; place-items: center;
    font-family: var(--display);
    font-weight: 700;
    font-size: 1.4rem;
    box-shadow: 0 3px 8px rgba(0, 0, 0, .35);
  }

  /* ---------- One more thing ---------- */
  .finish { text-align: center; padding-bottom: 5rem; }
  .cupcake {
    display: block;
    margin: 0 auto;
    background: none; border: 0; padding: 0;
    width: min(46vw, 190px);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    border-radius: 20px;
    transition: opacity .3s ease, transform .3s ease;
  }
  .cupcake svg { width: 100%; height: auto; display: block; overflow: visible; animation: bob 3.2s ease-in-out infinite; }
  .cupcake.gone { opacity: 0; transform: scale(.85); }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-1.5deg); }
    50% { transform: translateY(-7px) rotate(1.5deg); }
  }

  .surprise { opacity: 0; transform: scale(.94); transition: opacity .7s ease, transform .7s ease; }
  .surprise[hidden] { display: none; }
  .surprise.open { opacity: 1; transform: none; }
  .big {
    font-family: var(--display);
    font-weight: 900;
    font-size: clamp(2.6rem, 14vw, 5.5rem);
    line-height: 1;
    color: var(--accent);
    margin: 0;
  }
  .big span { display: block; }
  .big .who { font-size: .55em; margin-top: .35em; }
  .ring {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: .7rem;
    max-width: 22rem;
    margin: 2.25rem auto 0;
    align-items: center;
  }
  .mini {
    background: var(--paper);
    padding: .3rem;
    border-radius: 3px;
    box-shadow: 0 5px 14px rgba(20, 8, 4, .25);
    aspect-ratio: 1;
    transform: rotate(-3deg);
  }
  .mini:nth-child(even) { transform: rotate(2.5deg); }
  .mini .frame { height: 100%; aspect-ratio: auto; padding: 0; font-size: 1rem; border-width: 1.5px; color: var(--accent); }
  .cake.mid { width: 100%; border-radius: 12px; }
  .cake.mid svg { transform: scale(1.35); }

  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }

  @media (prefers-reduced-motion: reduce) {
    .flame, .fc, .fc i, .cupcake svg { animation: none; }
    :root.lit .smoke { animation: none; }
    body, #reveal, .surprise, .cupcake, .lane li { transition: none; }
  }.song {
  background: var(--paper);
  padding: .6rem;
  border-radius: 4px;
  box-shadow: 0 8px 22px rgba(20, 8, 4, .25);
  max-width: 38rem;
  margin: 0 auto;
  transform: rotate(-1deg);
}
.song iframe { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 2px; }
.song-note { text-align: center; margin: 1.1rem 0 0; font-style: italic; }
.side {
  position: fixed;
  bottom: env(safe-area-inset-bottom, 0px);
  z-index: -1;
  pointer-events: none;
  height: min(58vh, 520px);
  width: auto;
  max-width: 22vw;
  object-fit: contain;
  opacity: 0;
  transform: translateY(40px) scale(.85);
  transition: opacity .8s ease, transform .8s cubic-bezier(.2, .9, .3, 1.2);
  filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .35));
}
.side.on { opacity: 1; transform: none; }
.side-left { left: max(.5rem, env(safe-area-inset-left, 0px)); transform-origin: bottom left; }
.side-right { right: max(.5rem, env(safe-area-inset-right, 0px)); transform-origin: bottom right; }
@media (max-width: 52rem) {
  .side { height: 24vh; max-width: 32vw; }
  .side.on { opacity: .9; }
}
@media (prefers-reduced-motion: reduce) { .side { transition: none; } }
.finish { position: relative; overflow: hidden; }
.finish > *:not(.hearts) { position: relative; z-index: 1; }
.hearts { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
.heart {
  position: absolute;
  bottom: -30px;
  line-height: 1;
  opacity: 0;
  animation: rise 7s ease-in forwards;
}
@keyframes rise {
  0%   { transform: translate(0, 0) scale(.5) rotate(-10deg); opacity: 0; }
  12%  { opacity: .9; }
  100% { transform: translate(var(--dx), calc(-1 * var(--rise))) scale(1.1) rotate(12deg); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .hearts { display: none; } }
.boxes { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.1rem; }
.pbox {
  position: relative;
  width: calc(50% - .55rem);
  background: var(--paper);
  color: var(--lit-ink);
  font: inherit;
  text-align: center;
  border: 0;
  padding: .6rem .6rem .5rem;
  border-radius: 4px;
  box-shadow: 0 8px 22px rgba(20, 8, 4, .25);
  cursor: pointer;
  transform: rotate(-1.5deg);
  transition: transform .25s ease;
  -webkit-tap-highlight-color: transparent;
}
.pbox:nth-child(even) { transform: rotate(1.5deg); }
.pbox:hover { transform: translateY(-4px) rotate(0); }
.pbox .frame { aspect-ratio: 1; font-size: 1.4rem; color: var(--accent); }
.pbox .name { display: block; margin-top: .55rem; font-family: var(--display); font-size: .85rem; line-height: 1.25; }
.pbox::after {
  content: "\2665";
  position: absolute; top: -.5rem; right: -.4rem;
  width: 1.9rem; height: 1.9rem;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #B3273B, #7A1524);
  color: #F3E6C4;
  display: grid; place-items: center;
  font-size: .95rem;
  box-shadow: 0 2px 6px rgba(0, 0, 0, .35);
  transition: opacity .3s ease;
}
.pbox.read::after { opacity: .45; }
@media (min-width: 52rem) { .pbox { width: calc(25% - .85rem); } }

.note-dialog { border: 0; padding: 0; background: transparent; max-width: none; overflow: visible; }
.note-dialog::backdrop { background: rgba(12, 16, 36, .7); }
.note-dialog[open] { animation: pop .35s cubic-bezier(.2, .9, .3, 1.2); }
@keyframes pop { from { opacity: 0; transform: scale(.92) translateY(10px); } to { opacity: 1; transform: none; } }
.note {
  position: relative;
  display: flex; gap: 1.1rem; align-items: flex-start;
  background: var(--paper);
  color: var(--lit-ink);
  width: min(92vw, 34rem);
  max-height: 82vh;
  overflow: auto;
  padding: 1.4rem 1.3rem 1.5rem;
  border-radius: 6px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, .5);
}
.note-pic { flex: 0 0 38%; }
.note-pic img { width: 100%; height: auto; display: block; border-radius: 3px; }
.note-pic .frame { aspect-ratio: 1; font-size: 1.6rem; color: var(--accent); }
.note-body { flex: 1; min-width: 0; }
.note-body h3 { font-family: var(--display); font-weight: 700; font-size: 1.15rem; line-height: 1.25; margin: 0 0 .6rem; padding-right: 1.6rem; }
.note-body p { margin: 0; white-space: pre-line; font-style: italic; font-size: 1.15rem; }
.note-close { position: absolute; top: .4rem; right: .5rem; background: none; border: 0; font-size: 1.7rem; line-height: 1; cursor: pointer; color: var(--lit-ink); padding: .2rem .5rem; }
@media (prefers-reduced-motion: reduce) { .note-dialog[open] { animation: none; } .pbox { transition: none; } }
.garden { margin-top: 3.5rem; }
.garden h2 { margin-bottom: 1.25rem; }
.scene { display: block; width: 100%; max-width: 34rem; height: auto; margin: 0 auto; color: var(--ink); overflow: visible; }
.me-box {
  position: relative;
  display: block;
  width: min(100%, 20rem);
  margin: 3.5rem auto 0;
  background: var(--paper);
  color: var(--lit-ink);
  font: inherit;
  text-align: center;
  border: 0;
  border-radius: 6px;
  padding: .9rem .9rem 1.1rem;
  box-shadow: 0 12px 30px rgba(20, 8, 4, .3);
  cursor: pointer;
  transform: rotate(-1deg);
  transition: transform .25s ease;
  -webkit-tap-highlight-color: transparent;
}
.me-box:hover { transform: translateY(-4px) rotate(0); }
.me-box .frame { aspect-ratio: 1; font-size: 2rem; color: var(--accent); }
.me-box .label { display: block; margin-top: .85rem; font-family: var(--display); font-weight: 700; font-size: 1.15rem; line-height: 1.25; }
.me-box::after {
  content: "\2665";
  position: absolute; top: -.7rem; right: -.6rem;
  width: 2.4rem; height: 2.4rem;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #B3273B, #7A1524);
  color: #F3E6C4;
  display: grid; place-items: center;
  font-size: 1.15rem;
  box-shadow: 0 2px 6px rgba(0, 0, 0, .35);
  transition: opacity .3s ease;
}
.me-box.read::after { opacity: .45; }
@media (prefers-reduced-motion: reduce) { .me-box { transition: none; } }
.love-scene { display: block; width: min(100%, 40rem); height: auto; margin: 3.5rem auto 0; color: var(--ink); overflow: visible; }
.love-scene .beat { transform-box: fill-box; transform-origin: 50% 55%; animation: beat 2.6s ease-in-out infinite; }
@keyframes beat { 0%, 100% { transform: scale(1); } 45% { transform: scale(1.025); } 55% { transform: scale(1.01); } }
.together { margin-top: 3rem; text-align: center; }
.together h2 { margin-bottom: 1.25rem; }
.counter { display: flex; flex-wrap: wrap; justify-content: center; gap: .7rem; }
.cnt { background: var(--paper); color: var(--lit-ink); border-radius: 6px; padding: .75rem .4rem .6rem; min-width: 4.7rem; box-shadow: 0 8px 22px rgba(20, 8, 4, .25); }
.cnt b { display: block; font-family: var(--display); font-weight: 700; font-size: 1.9rem; line-height: 1.1; color: var(--accent); }
.cnt span { display: block; font-size: .95rem; }
@media (prefers-reduced-motion: reduce) { .love-scene .beat { animation: none; } }
</style>
</head>
<body>

<header class="stage">
  <div class="ceiling" id="ceiling" aria-hidden="true"></div>
  <h1 id="title" aria-live="polite">Make a wish.</h1>
  <button class="cake" id="cake" type="button" aria-label="Blow out the candles">
    <svg viewBox="0 0 300 300" aria-hidden="true">
      <defs>
        <radialGradient id="glow">
          <stop offset="0" stop-color="#FFB627" stop-opacity=".55"/>
          <stop offset="1" stop-color="#FFB627" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <ellipse cx="150" cy="268" rx="128" ry="14" fill="var(--pewter)"/>

      <rect x="40" y="190" width="220" height="72" rx="14" fill="var(--cake1)"/>
      <rect x="40" y="190" width="220" height="24" rx="12" fill="var(--cake3)"/>
      <g fill="var(--cake3)">
        <circle cx="58" cy="214" r="13"/><circle cx="86" cy="214" r="13"/><circle cx="114" cy="214" r="13"/>
        <circle cx="142" cy="214" r="13"/><circle cx="170" cy="214" r="13"/><circle cx="198" cy="214" r="13"/>
        <circle cx="226" cy="214" r="13"/><circle cx="246" cy="214" r="13"/>
      </g>

      <rect x="75" y="130" width="150" height="64" rx="12" fill="var(--cake2)"/>
      <rect x="75" y="130" width="150" height="22" rx="11" fill="var(--cake3)"/>
      <g fill="var(--cake3)">
        <circle cx="90" cy="152" r="12"/><circle cx="114" cy="152" r="12"/><circle cx="138" cy="152" r="12"/>
        <circle cx="162" cy="152" r="12"/><circle cx="186" cy="152" r="12"/><circle cx="210" cy="152" r="12"/>
      </g>

      <rect x="116" y="98" width="8" height="34" rx="3" fill="#B3273B"/>
      <rect x="146" y="98" width="8" height="34" rx="3" fill="#F3E6C4"/>
      <rect x="176" y="98" width="8" height="34" rx="3" fill="#D9A93A"/>
      <g stroke="#0C1024" stroke-width="2" stroke-linecap="round">
        <line x1="120" y1="98" x2="120" y2="92"/><line x1="150" y1="98" x2="150" y2="92"/><line x1="180" y1="98" x2="180" y2="92"/>
      </g>

      <g class="glow">
        <circle cx="120" cy="80" r="44" fill="url(#glow)"/>
        <circle cx="150" cy="80" r="44" fill="url(#glow)"/>
        <circle cx="180" cy="80" r="44" fill="url(#glow)"/>
      </g>

      <g transform="translate(120,92)"><g class="flame" style="animation-delay:-.2s">
        <path d="M0,-28 C9,-15 9,-4 0,0 C-9,-4 -9,-15 0,-28Z" fill="#FFB627"/>
        <path d="M0,-14 C4,-8 4,-3 0,0 C-4,-3 -4,-8 0,-14Z" fill="#FFF3B0"/>
      </g></g>
      <g transform="translate(150,92)"><g class="flame" style="animation-delay:-.7s">
        <path d="M0,-28 C9,-15 9,-4 0,0 C-9,-4 -9,-15 0,-28Z" fill="#FFB627"/>
        <path d="M0,-14 C4,-8 4,-3 0,0 C-4,-3 -4,-8 0,-14Z" fill="#FFF3B0"/>
      </g></g>
      <g transform="translate(180,92)"><g class="flame" style="animation-delay:-1.1s">
        <path d="M0,-28 C9,-15 9,-4 0,0 C-9,-4 -9,-15 0,-28Z" fill="#FFB627"/>
        <path d="M0,-14 C4,-8 4,-3 0,0 C-4,-3 -4,-8 0,-14Z" fill="#FFF3B0"/>
      </g></g>

      <g transform="translate(120,88)"><path class="smoke" d="M0,0 C-7,-9 7,-15 0,-26"/></g>

<script>
  /* =====================================================
     EDIT THIS PART. Change the words inside the quotes.
     PHOTOS: upload them to the same place as this file and
     name them photo1, photo2 ... and plushie1 ... plushie8
     (.jpg, .jpeg or .png all work). Until a photo exists,
     you'll see a dashed placeholder telling you its name.
     ===================================================== */
  const CONFIG = {
    name: "Tamara",

    memories: [
      { photo: "photo1", date: "[15 June 2025]", title: "OUR PROM absolutely aura lowkey..",            text: "[THis pic is still lowkey my fav pic of us, what about you?.]" },
      { photo: "photo2", date: "[23 July 2025]", title: "The real indian couple",       text: "[I couldve put the one where we were on the floor, but this ones better.]" },
      { photo: "photo3", date: "[22 September 2025]", title: "ONE year ago today", text: "[peppa pig and georgy and daddy and mommy pig, im lowkey matching with george.]" },
      { photo: "photo4", date: "[10 February 2026]", title: "I have absolutely no clue what we doing",  text: "[We NEED to go there again.]" },
      { photo: "photo5", date: "[15 June 2025]", title: "ZAMN you look gorgeous here",         text: "[Looking very majestic baby!!.]" },
      { photo: "photo6", date: "[19 July 2026]", title: "Youre favorite picture of me",                 text: "[HAHAHHAHA.]" }
    ],

    paragraph: "[Dear Tamara, I want to say you are the most beautiful and wonderful human being i have ever met, i really really love you very very much sayanggku,my cutie patotiee, HAPPY BIRTHDAY!! youre truly my sunshine, Youre turning 20 years old! thats crazy, hope you have a wonderful birthday sayangg, with a lot of love and gifts! Enjoy your harry potter movie night! .]"
  };
  /* ===================================================== */

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  document.title = "Happy Birthday, " + CONFIG.name;
  $('title').textContent = "Make a wish, " + CONFIG.name + ".";

  /* Look for a photo under a few common file endings. Calls back only if one loads. */
  function probe(base, onFound) {
    const exts = ['jpg', 'jpeg', 'png', 'webp', 'JPG', 'JPEG', 'PNG'];
    let i = 0;
    const img = new Image();
    img.onload = () => onFound(img);
    img.onerror = () => { i++; if (i < exts.length) img.src = base + '.' + exts[i]; };
    img.src = base + '.' + exts[0];
  }
  function fillFrame(frame, img, alt) {
    img.alt = alt;
    frame.className = 'frame has-photo';
    frame.replaceChildren(img);
  }

  /* Floating candles */
  const candles = [
    { l: 6, t: 6, s: .8, d: 7.5, w: 0 }, { l: 24, t: 2, s: 1, d: 6.5, w: -2 },
    { l: 47, t: 9, s: .7, d: 8, w: -4 }, { l: 68, t: 3, s: 1.05, d: 7, w: -1 },
    { l: 88, t: 8, s: .85, d: 6.8, w: -3 }, { l: 14, t: 20, s: .6, d: 8.5, w: -5 },
    { l: 82, t: 24, s: .65, d: 7.8, w: -2.5 }
  ];
  $('ceiling').innerHTML = candles.map((c) =>
    `<div class="fc" style="left:${c.l}%;top:${c.t}%;--s:${c.s};--dur:${c.d}s;--del:${c.w}s"><i></i></div>`
  ).join('');

  /* Memory lane */
  const lane = $('lane');
  CONFIG.memories.forEach((m) => {
    const li = document.createElement('li');
    li.innerHTML =
      `<span class="when">${esc(m.date)}</span>` +
      `<h3>${esc(m.title)}</h3>` +
      (m.photo ? `<div class="pola"><div class="frame">${esc(m.photo)}.jpg goes here</div></div>` : '') +
      `<p>${esc(m.text)}</p>`;
    lane.appendChild(li);
    if (m.photo) {
      const frame = li.querySelector('.frame');
      probe(m.photo, (img) => fillFrame(frame, img, m.title));
    }
  });

  /* Fade each memory in as she scrolls */
  if ('IntersectionObserver' in window && !reduce) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('seen'); io.unobserve(e.target); } });
    }, { threshold: 0.2 });
    lane.querySelectorAll('li').forEach((li) => io.observe(li));
  } else {
    lane.querySelectorAll('li').forEach((li) => li.classList.add('seen'));
  }

  $('paragraph').textContent = CONFIG.paragraph;
  $('seal').textContent = CONFIG.name.charAt(0);

  /* Surprise: 8 plushie frames around a cake (plushie1 ... plushie8) */
  $('big').innerHTML = `<span>Happy</span><span>Birthday</span><span class="who">Mommy!!</span>`;
  const ring = $('ring');
  for (let n = 1; n <= 8; n++) {
    if (n === 5) {
      const b = document.createElement('button');
      b.className = 'cake mid';
      b.type = 'button';
      b.setAttribute('aria-label', 'More confetti');
      b.innerHTML = $('cakeTpl').innerHTML;
      b.addEventListener('click', () => burst(0.55));
      ring.appendChild(b);
    }
    const mini = document.createElement('div');
    mini.className = 'mini';
    const frame = document.createElement('div');
    frame.className = 'frame';
    frame.innerHTML = '&#10022;';
    mini.appendChild(frame);
    ring.appendChild(mini);
    probe('plushie' + n, (img) => fillFrame(frame, img, 'A plushie'));
  }

  /* Confetti */
  let raf = 0;
  function burst(fromY) {
    if (reduce) return;
    cancelAnimationFrame(raf);
    const c = $('confetti');
    const ctx = c.getContext('2d');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = window.innerWidth, H = window.innerHeight;
    c.width = W * dpr; c.height = H * dpr;
    ctx.scale(dpr, dpr);
    const colors = ['#FFB627', '#D9A93A', '#B3273B', '#F3E6C4', '#7A9CD6', '#FFFFFF'];
    const parts = Array.from({ length: 170 }, () => ({
      x: W / 2, y: H * (fromY || 0.5),
      vx: (Math.random() - 0.5) * 16,
      vy: -(6 + Math.random() * 11),
      w: 6 + Math.random() * 6,
      h: 10 + Math.random() * 8,
      r: Math.random() * 6.28,
      vr: (Math.random() - 0.5) * 0.3,
      col: colors[Math.floor(Math.random() * colors.length)]
    }));
    const start = performance.now();
    (function frame(now) {
      ctx.clearRect(0, 0, W, H);
      parts.forEach((p) => {
        p.vy += 0.26; p.vx *= 0.99; p.vy *= 0.995;
        p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.r);
        ctx.fillStyle = p.col;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
      if (now - start < 4200) raf = requestAnimationFrame(frame);
      else ctx.clearRect(0, 0, W, H);
    })(start);
  }

  /* Blow out the candles */
  let lit = false;
  $('cake').addEventListener('click', () => {
    if (lit) return;
    lit = true;
    document.documentElement.classList.add('lit');
    $('cake').setAttribute('aria-label', 'Candles blown out');
    $('reveal').hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => $('reveal').classList.add('in')));
    burst(0.5);
    setTimeout(() => {
      if (window.scrollY < 40) {
        $('reveal').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
      }
    }, 2600);
  });

  /* Cupcake opens the surprise */
  let opened = false;
  $('cupcake').addEventListener('click', () => {
    if (opened) return;
    opened = true;
    const cup = $('cupcake');
    cup.classList.add('gone');
    setTimeout(() => {
      cup.style.display = 'none';
      const s = $('surprise');
      s.hidden = false;
      requestAnimationFrame(() => requestAnimationFrame(() => s.classList.add('open')));
      burst(0.5);
      setTimeout(() => s.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }), 300);
    }, reduce ? 0 : 300);
  });
/* Side pictures that pop up beside the memory lane */
['left', 'right'].forEach((side) => {
  probe('side-' + side, (img) => {
    img.className = 'side side-' + side;
    img.alt = '';
    img.setAttribute('aria-hidden', 'true');
    document.body.appendChild(img);
    if ('IntersectionObserver' in window) {
      new IntersectionObserver((entries) => {
        entries.forEach((e) => img.classList.toggle('on', e.isIntersecting));
      }, { threshold: 0 }).observe(lane);
    } else {
      img.classList.add('on');
    }
  });
});
/* Floating hearts around the cupcake and plushie frames */
(function () {
  const finish = $('finish');
  const layer = document.createElement('div');
  layer.className = 'hearts';
  layer.setAttribute('aria-hidden', 'true');
  finish.prepend(layer);

  const colors = ['#B3273B', '#D9536A', '#E58AA0', '#C9982F', '#8C1C2C'];
  function heart() {
    const h = document.createElement('span');
    h.className = 'heart';
    h.textContent = '\u2665';
    h.style.left = (Math.random() * 94 + 3) + '%';
    h.style.fontSize = (14 + Math.random() * 22) + 'px';
    h.style.color = colors[Math.floor(Math.random() * colors.length)];
    h.style.setProperty('--rise', (finish.offsetHeight + 60) + 'px');
    h.style.setProperty('--dx', (Math.random() * 80 - 40) + 'px');
    h.style.animationDuration = (5 + Math.random() * 4) + 's';
    layer.appendChild(h);
    h.addEventListener('animationend', () => h.remove());
  }

  let timer = null;
  const start = () => { if (!timer && !reduce) timer = setInterval(heart, 550); };
  const stop = () => { clearInterval(timer); timer = null; };

  if ('IntersectionObserver' in window) {
    new IntersectionObserver((entries) => {
      entries.forEach((e) => (e.isIntersecting ? start() : stop()));
    }, { threshold: 0 }).observe(finish);
  }

  // Extra burst when she taps the cupcake
  $('cupcake').addEventListener('click', () => {
    if (reduce) return;
    for (let i = 0; i < 24; i++) setTimeout(heart, i * 90);
  });
})();

/* Flowers for you: two stick figures, a bouquet, trees and grass */
(function () {
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const pick = (a) => a[Math.floor(rnd() * a.length)];
  const petals = ['#B3273B', '#D9536A', '#E58AA0', '#D9A93A', '#F3E6C4', '#C77DBA'];

  function head(x, y, r, color) {
    let s = '';
    for (let a = 0; a < 5; a++) {
      const t = (a * 72 - 90) * Math.PI / 180;
      s += `<circle cx="${(x + Math.cos(t) * r * 0.95).toFixed(1)}" cy="${(y + Math.sin(t) * r * 0.95).toFixed(1)}" r="${(r * 0.62).toFixed(1)}" fill="${color}"/>`;
    }
    return s + `<circle cx="${x}" cy="${y}" r="${(r * 0.5).toFixed(1)}" fill="#FFB627"/>`;
  }
  function flower(x, base, h, r, color) {
    const y = base - h;
    const ly = (base - h * 0.45).toFixed(1);
    return `<line x1="${x}" y1="${base}" x2="${x}" y2="${y}" stroke="#3F6B2A" stroke-width="2"/>` +
      `<ellipse cx="${x + 5}" cy="${ly}" rx="5" ry="2.4" fill="#4F7A34" transform="rotate(-25 ${x + 5} ${ly})"/>` +
      head(x, y, r, color);
  }

  let blades = '';
  for (let i = 0; i < 120; i++) {
    const x = (rnd() * 400).toFixed(1), h = 7 + rnd() * 12, lean = (rnd() - 0.5) * 8;
    blades += `<path d="M${x},226 q${(lean / 2).toFixed(1)},${(-h * 0.6).toFixed(1)} ${lean.toFixed(1)},${(-h).toFixed(1)}" stroke="${pick(['#4F7A34', '#6B9A45', '#3F6B2A'])}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  }
  let flowers = '';
  for (let i = 0; i < 16; i++) {
    const x = Math.round(14 + i * 24.5 + (rnd() - 0.5) * 10);
    flowers += flower(x, 234 + Math.round(rnd() * 8), 14 + Math.round(rnd() * 22), 4.5 + rnd() * 2.5, pick(petals));
  }

  function face(id, cx, file) {
    return `<clipPath id="clip${id}"><circle cx="${cx}" cy="112" r="24"/></clipPath>` +
      `<g id="ph${id}"><circle cx="${cx}" cy="112" r="24" fill="var(--lit-bg)" stroke="currentColor" stroke-width="3" stroke-dasharray="4 3"/>` +
      `<text x="${cx}" y="118" text-anchor="middle" font-size="16" fill="var(--accent)">&#10022;</text></g>` +
      `<image id="img${id}" x="${cx - 24}" y="88" width="48" height="48" preserveAspectRatio="xMidYMid slice" clip-path="url(#clip${id})" style="display:none"/>` +
      `<circle id="ring${id}" cx="${cx}" cy="112" r="24" fill="none" stroke="currentColor" stroke-width="3" style="display:none"/>`;
  }

  const svg =
    `<svg class="scene" viewBox="0 0 400 250" role="img" aria-label="Two stick figures, one handing the other a bouquet of flowers">` +
    /* trees and bushes */
    `<rect x="42" y="140" width="12" height="84" fill="#6B4423"/><circle cx="48" cy="122" r="34" fill="#4F7A34"/><circle cx="26" cy="146" r="23" fill="#4F7A34"/><circle cx="70" cy="146" r="23" fill="#4F7A34"/><circle cx="38" cy="112" r="13" fill="#6B9A45"/>` +

      `<line x1="254" y1="192" x2="250" y2="222"/><line x1="270" y1="192" x2="274" y2="222"/>` +

/* Us inside a big heart, plus a counter */
(function () {
  /* ===== EDIT THIS PART ===== */
  const LOVE = {
    title: "Together for",
    start: "2025-07-15T00:00:00"   /* year-month-day, then T, then hour:minute:second (24-hour) */
  };
  /* ========================== */

  function face(id, cx, cy, r) {
    return `<clipPath id="clip${id}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath>` +
      `<g id="ph${id}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--lit-bg)" stroke="currentColor" stroke-width="3.5" stroke-dasharray="5 4"/>` +
      `<text x="${cx}" y="${cy + 7}" text-anchor="middle" font-size="20" fill="var(--accent)">&#10022;</text></g>` +
      `<image id="img${id}" x="${cx - r}" y="${cy - r}" width="${r * 2}" height="${r * 2}" preserveAspectRatio="xMidYMid slice" clip-path="url(#clip${id})" style="display:none"/>` +
      `<circle id="ring${id}" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="currentColor" stroke-width="3.5" style="display:none"/>`;
  }

  const svg =
    `<svg class="love-scene" viewBox="0 0 400 362" role="img" aria-label="Two stick figures holding hands inside a big heart">` +
    `<path class="beat" d="M200,350 C40,250 10,150 10,100 C10,45 55,10 105,10 C145,10 178,32 200,68 C222,32 255,10 295,10 C345,10 390,45 390,100 C390,150 360,250 200,350 Z" fill="var(--paper)" stroke="#B3273B" stroke-width="7" stroke-linejoin="round"/>` +
    `<text x="200" y="114" text-anchor="middle" font-size="26" fill="#B3273B">&#9829;</text>` +
    `<text x="186" y="90" text-anchor="middle" font-size="14" fill="#D9536A">&#9829;</text>` +
    `<text x="215" y="92" text-anchor="middle" font-size="12" fill="#D9536A">&#9829;</text>` +
    `<path d="M116,272 H284" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".35"/>` +
    `<g stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">` +
      `<line x1="140" y1="148" x2="140" y2="214"/><line x1="140" y1="214" x2="122" y2="268"/><line x1="140" y1="214" x2="158" y2="268"/>` +
      `<path d="M140,166 L172,182 L200,194"/><line x1="140" y1="166" x2="110" y2="204"/>` +
      `<line x1="260" y1="148" x2="260" y2="160"/><path d="M260,158 L236,226 L284,226 Z" fill="var(--paper)"/>` +
      `<line x1="250" y1="226" x2="246" y2="268"/><line x1="270" y1="226" x2="274" y2="268"/>` +
      `<path d="M260,170 L228,182 L200,194"/><line x1="260" y1="170" x2="290" y2="206"/>` +
      `<circle cx="200" cy="194" r="6.5" fill="currentColor" stroke="none"/>` +
    `</g>` +
    face('Him2', 140, 120, 30) + face('Her2', 260, 120, 30) +
    `</svg>`;

  const love = document.createElement('div');
  love.className = 'love';
  love.innerHTML = svg;
  $('surprise').appendChild(love);

  function showFace(id, file) {
    probe(file, (img) => {
      love.querySelector('#img' + id).setAttribute('href', img.src);
      love.querySelector('#img' + id).style.display = '';
      love.querySelector('#ring' + id).style.display = '';
      love.querySelector('#ph' + id).style.display = 'none';
    });
  }
  showFace('Him2', 'plushie8');
  showFace('Her2', 'her-face');

  /* Counter */
  const together = document.createElement('div');
  together.className = 'together';
  together.innerHTML = `<h2>${esc(LOVE.title)}</h2><div class="counter" id="counter"></div>`;
  $('surprise').appendChild(together);

  const start = new Date(LOVE.start);
  const units = [
    ['year', 'years', 'y'],
    ['month', 'months', 'mo'],
    ['day', 'days', 'd'],
    ['hour', 'hours', 'h'],
    ['minute', 'minutes', 'mi'],
    ['second', 'seconds', 's']
  ];
  function diff(a, b) {
    let y = b.getFullYear() - a.getFullYear(), mo = b.getMonth() - a.getMonth(), d = b.getDate() - a.getDate();
    let h = b.getHours() - a.getHours(), mi = b.getMinutes() - a.getMinutes(), s = b.getSeconds() - a.getSeconds();
    if (s < 0) { s += 60; mi--; }
    if (mi < 0) { mi += 60; h--; }
    if (h < 0) { h += 24; d--; }
    if (d < 0) { d += new Date(b.getFullYear(), b.getMonth(), 0).getDate(); mo--; }
    if (mo < 0) { mo += 12; y--; }
    return { y, mo, d, h, mi, s };
  }
  function tick() {
    const now = new Date();
    if (isNaN(start) || now < start) return;
    const t = diff(start, now);
    $('counter').innerHTML = units.map((u) =>
      `<div class="cnt"><b>${t[u[2]]}</b><span>${t[u[2]] === 1 ? u[0] : u[1]}</span></div>`
    ).join('');
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
