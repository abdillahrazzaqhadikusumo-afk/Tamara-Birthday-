<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0C1024;
    --night-ink: #F3E6C4;
    --lit-bg: #E9DAB4;
    --lit-ink: #2B1A12;
    --paper: #F7EDD3;
    --accent: #8C1C2C;
    --gold: #C9982F;
    --flame: #FFB627;
    --pewter: #9AA3B5;
    --cake1: #8C1C2C;
    --cake2: #D9A93A;
    --cake3: #F6EAD0;
    --display: "Cinzel Decorative", "Trajan Pro", Georgia, "Times New Roman", serif;
    --body: "IM Fell English", Georgia, "Times New Roman", serif;
    --bg: var(--night);
    --ink: var(--night-ink);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root.lit { --bg: var(--lit-bg); --ink: var(--lit-ink); }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 1.2rem;
    line-height: 1.6;
    transition: background-color 1.6s ease, color 1.6s ease;
  }
  :focus-visible { outline: 3px solid var(--flame); outline-offset: 4px; }

  /* ---------- Opening: candlelit hall ---------- */
  .stage {
    position: relative;
    overflow: hidden;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    text-align: center;
    padding: 3rem max(1.25rem, env(safe-area-inset-right, 0px)) 2rem max(1.25rem, env(safe-area-inset-left, 0px));
  }
  .stage > *:not(.ceiling) { position: relative; z-index: 1; }
  #title {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(2rem, 8.5vw, 3.6rem);
    line-height: 1.15;
    margin: 0;
    text-wrap: balance;
  }

  .ceiling { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
  .fc {
    position: absolute;
    width: 12px;
    height: 64px;
    scale: var(--s, 1);
    transform-origin: 50% 100%;
    animation: float var(--dur, 7s) ease-in-out infinite;
    animation-delay: var(--del, 0s);
  }
  .fc::after {
    content: "";
    position: absolute; left: 0; bottom: 0;
    width: 12px; height: 42px;
    background: #F3E6C4;
    border-radius: 3px 3px 2px 2px;
  }
  .fc i {
    position: absolute; left: 50%; top: 6px;
    width: 9px; height: 18px; margin-left: -4.5px;
    background: var(--flame);
    border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
    box-shadow: 0 0 16px 7px rgba(255, 182, 39, .45);
    transform-origin: 50% 100%;
    animation: flicker 1.4s ease-in-out infinite;
    transition: box-shadow 1.6s ease;
  }
  :root.lit .fc i { box-shadow: 0 0 8px 3px rgba(255, 182, 39, .3); }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-12px) rotate(2deg); }
  }

  .cake {
    background: none; border: 0; padding: 0; margin: 0;
    width: min(78vw, 340px);
    cursor: pointer;
    display: block;
    border-radius: 24px;
    -webkit-tap-highlight-color: transparent;
    color: inherit;
  }
  .cake svg { width: 100%; height: auto; display: block; overflow: visible; }
  .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 1.6s ease-in-out infinite; transition: opacity .25s ease; }
  .glow { transition: opacity .4s ease; }
  :root.lit #cake .flame, :root.lit #cake .glow { opacity: 0; }
  .smoke { opacity: 0; fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
  :root.lit .smoke { animation: smoke 2s ease-out forwards; }
  @keyframes flicker {
    0%, 100% { transform: scale(1, 1) rotate(-1deg); }
    35% { transform: scale(.94, 1.06) rotate(1.5deg); }
    70% { transform: scale(1.04, .96) rotate(-1deg); }
  }
  @keyframes smoke {
    0% { opacity: .6; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-26px); }
  }

  /* ---------- After the candles ---------- */
  #reveal { opacity: 0; transition: opacity 1.6s ease .6s; }
  #reveal[hidden] { display: none; }
  #reveal.in { opacity: 1; }
  .wrap {
    max-width: 38rem;
    margin: 0 auto;
    padding-left: max(1.25rem, env(safe-area-inset-left, 0px));
    padding-right: max(1.25rem, env(safe-area-inset-right, 0px));
  }
  .block { padding-top: clamp(3rem, 9vw, 5.5rem); padding-bottom: clamp(1.5rem, 5vw, 3rem); }
  h2 {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(1.5rem, 6vw, 2.2rem);
    line-height: 1.2;
    margin: 0 0 2.25rem;
    text-wrap: balance;
  }

  /* ---------- Memory lane ---------- */
  .lane {
    list-style: none;
    margin: 0;
    padding: 0;
    position: relative;
  }
  .lane::before {
    content: "";
    position: absolute;
    top: 0; bottom: 0; left: 10px;
    border-left: 3px dashed var(--accent);
  }
  .lane li {
    position: relative;
    padding: 0 0 3.75rem 2.75rem;
    opacity: 0;
    transform: translateY(26px);
    transition: opacity .9s ease, transform .9s ease;
  }
  .lane li.seen { opacity: 1; transform: none; }
  .lane li::before {
    content: "";
    position: absolute;
    left: 0; top: .3rem;
    width: 23px; height: 23px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 0 5px var(--bg);
  }
  .when { display: block; font-family: var(--display); font-weight: 400; font-size: .95rem; color: var(--accent); margin-bottom: .15rem; }
  .lane h3 { font-family: var(--display); font-weight: 700; font-size: 1.3rem; line-height: 1.25; margin: 0 0 .4rem; }
  .lane p { margin: 0; }
  .pola {
    background: var(--paper);
    padding: .6rem;
    border-radius: 3px;
    box-shadow: 0 8px 22px rgba(20, 8, 4, .25);
    max-width: 20rem;
    margin: .9rem 0 1.1rem;
    transform: rotate(-1.5deg);
  }
  .lane li:nth-child(even) .pola { transform: rotate(1.5deg); }

  .frame {
    aspect-ratio: 4 / 5;
    display: grid;
    place-items: center;
    text-align: center;
    padding: .75rem;
    font-size: .95rem;
    line-height: 1.3;
    background: var(--lit-bg);
    border: 2px dashed var(--accent);
    color: var(--ink);
  }
  .frame.has-photo { padding: 0; border: 0; }
  .frame img { width: 100%; height: 100%; object-fit: cover; display: block; }

  @media (min-width: 52rem) {
    .wrap { max-width: 52rem; }
    .lane::before { left: 50%; margin-left: -1.5px; }
    .lane li { width: 50%; padding: 0 3rem 4rem 0; text-align: right; }
    .lane li::before { left: auto; right: -11.5px; }
    .lane li:nth-child(even) { margin-left: 50%; padding: 0 0 4rem 3rem; text-align: left; }
    .lane li:nth-child(even)::before { right: auto; left: -11.5px; }
    .lane li:nth-child(odd) .pola { margin-left: auto; }
  }

  /* ---------- Paragraph on parchment ---------- */
  .letter {
    position: relative;
    background: var(--paper);
    padding: 2rem 1.6rem 3.4rem;
    border-radius: 4px;
    box-shadow: 0 8px 22px rgba(20, 8, 4, .25);
    max-width: 38rem;
    margin: 0 auto;
  }
  .letter p { margin: 0; white-space: pre-line; font-style: italic; font-size: 1.25rem; color: var(--lit-ink); }
  .seal {
    position: absolute;
    left: 50%; bottom: -1.7rem;
    transform: translateX(-50%);
    width: 3.4rem; height: 3.4rem;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #B3273B, #7A1524);
    color: #F3E6C4;
    display: grid; place-items: center;
    font-family: var(--display);
    font-weight: 700;
    font-size: 1.4rem;
    box-shadow: 0 3px 8px rgba(0, 0, 0, .35);
  }

  /* ---------- One more thing ---------- */
  .finish { text-align: center; padding-bottom: 5rem; }
  .cupcake {
    display: block;
    margin: 0 auto;
    background: none; border: 0; padding: 0;
    width: min(46vw, 190px);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    border-radius: 20px;
    transition: opacity .3s ease, transform .3s ease;
  }
  .cupcake svg { width: 100%; height: auto; display: block; overflow: visible; animation: bob 3.2s ease-in-out infinite; }
  .cupcake.gone { opacity: 0; transform: scale(.85); }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-1.5deg); }
    50% { transform: translateY(-7px) rotate(1.5deg); }
  }

  .surprise { opacity: 0; transform: scale(.94); transition: opacity .7s ease, transform .7s ease; }
  .surprise[hidden] { display: none; }
  .surprise.open { opacity: 1; transform: none; }
  .big {
    font-family: var(--display);
    font-weight: 900;
    font-size: clamp(2.6rem, 14vw, 5.5rem);
    line-height: 1;
    color: var(--accent);
    margin: 0;
  }
  .big span { display: block; }
  .big .who { font-size: .55em; margin-top: .35em; }
  .ring {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: .7rem;
    max-width: 22rem;
    margin: 2.25rem auto 0;
    align-items: center;
  }
  .mini {
    background: var(--paper);
    padding: .3rem;
    border-radius: 3px;
    box-shadow: 0 5px 14px rgba(20, 8, 4, .25);
    aspect-ratio: 1;
    transform: rotate(-3deg);
  }
  .mini:nth-child(even) { transform: rotate(2.5deg); }
  .mini .frame { height: 100%; aspect-ratio: auto; padding: 0; font-size: 1rem; border-width: 1.5px; color: var(--accent); }
  .cake.mid { width: 100%; border-radius: 12px; }
  .cake.mid svg { transform: scale(1.35); }

  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }

  @media (prefers-reduced-motion: reduce) {
    .flame, .fc, .fc i, .cupcake svg { animation: none; }
    :root.lit .smoke { animation: none; }
    body, #reveal, .surprise, .cupcake, .lane li { transition: none; }
  }.song {
  background: var(--paper);
  padding: .6rem;
  border-radius: 4px;
  box-shadow: 0 8px 22px rgba(20, 8, 4, .25);
  max-width: 38rem;
  margin: 0 auto;
  transform: rotate(-1deg);
}
.song iframe { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 2px; }
.song-note { text-align: center; margin: 1.1rem 0 0; font-style: italic; }
.side {
  position: fixed;
  bottom: env(safe-area-inset-bottom, 0px);
  z-index: -1;
  pointer-events: none;
  height: min(58vh, 520px);
  width: auto;
  max-width: 22vw;
  object-fit: contain;
  opacity: 0;
  transform: translateY(40px) scale(.85);
  transition: opacity .8s ease, transform .8s cubic-bezier(.2, .9, .3, 1.2);
  filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .35));
}
.side.on { opacity: 1; transform: none; }
.side-left { left: max(.5rem, env(safe-area-inset-left, 0px)); transform-origin: bottom left; }
.side-right { right: max(.5rem, env(safe-area-inset-right, 0px)); transform-origin: bottom right; }
@media (max-width: 52rem) {
  .side { height: 24vh; max-width: 32vw; }
  .side.on { opacity: .9; }
}
@media (prefers-reduced-motion: reduce) { .side { transition: none; } }
.finish { position: relative; overflow: hidden; }
.finish > *:not(.hearts) { position: relative; z-index: 1; }
.hearts { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
.heart {
  position: absolute;
  bottom: -30px;
  line-height: 1;
  opacity: 0;
  animation: rise 7s ease-in forwards;
}
@keyframes rise {
  0%   { transform: translate(0, 0) scale(.5) rotate(-10deg); opacity: 0; }
  12%  { opacity: .9; }
  100% { transform: translate(var(--dx), calc(-1 * var(--rise))) scale(1.1) rotate(12deg); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .hearts { display: none; } }
.boxes { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.1rem; }
.pbox {
  position: relative;
  width: calc(50% - .55rem);
  background: var(--paper);
  color: var(--lit-ink);
  font: inherit;
  text-align: center;
  border: 0;
  padding: .6rem .6rem .5rem;
  border-radius: 4px;
  box-shadow: 0 8px 22px rgba(20, 8, 4, .25);
  cursor: pointer;
  transform: rotate(-1.5deg);
  transition: transform .25s ease;
  -webkit-tap-highlight-color: transparent;
}
.pbox:nth-child(even) { transform: rotate(1.5deg); }
.pbox:hover { transform: translateY(-4px) rotate(0); }
.pbox .frame { aspect-ratio: 1; font-size: 1.4rem; color: var(--accent); }
.pbox .name { display: block; margin-top: .55rem; font-family: var(--display); font-size: .85rem; line-height: 1.25; }
.pbox::after {
  content: "\2665";
  position: absolute; top: -.5rem; right: -.4rem;
  width: 1.9rem; height: 1.9rem;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #B3273B, #7A1524);
  color: #F3E6C4;
  display: grid; place-items: center;
  font-size: .95rem;
  box-shadow: 0 2px 6px rgba(0, 0, 0, .35);
  transition: opacity .3s ease;
}
.pbox.read::after { opacity: .45; }
@media (min-width: 52rem) { .pbox { width: calc(25% - .85rem); } }

.note-dialog { border: 0; padding: 0; background: transparent; max-width: none; overflow: visible; }
.note-dialog::backdrop { background: rgba(12, 16, 36, .7); }
.note-dialog[open] { animation: pop .35s cubic-bezier(.2, .9, .3, 1.2); }
@keyframes pop { from { opacity: 0; transform: scale(.92) translateY(10px); } to { opacity: 1; transform: none; } }
.note {
  position: relative;
  display: flex; gap: 1.1rem; align-items: flex-start;
  background: var(--paper);
  color: var(--lit-ink);
  width: min(92vw, 34rem);
  max-height: 82vh;
  overflow: auto;
  padding: 1.4rem 1.3rem 1.5rem;
  border-radius: 6px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, .5);
}
.note-pic { flex: 0 0 38%; }
.note-pic img { width: 100%; height: auto; display: block; border-radius: 3px; }
.note-pic .frame { aspect-ratio: 1; font-size: 1.6rem; color: var(--accent); }
.note-body { flex: 1; min-width: 0; }
.note-body h3 { font-family: var(--display); font-weight: 700; font-size: 1.15rem; line-height: 1.25; margin: 0 0 .6rem; padding-right: 1.6rem; }
.note-body p { margin: 0; white-space: pre-line; font-style: italic; font-size: 1.15rem; }
.note-close { position: absolute; top: .4rem; right: .5rem; background: none; border: 0; font-size: 1.7rem; line-height: 1; cursor: pointer; color: var(--lit-ink); padding: .2rem .5rem; }
@media (prefers-reduced-motion: reduce) { .note-dialog[open] { animation: none; } .pbox { transition: none; } }
.garden { margin-top: 3.5rem; }
.garden h2 { margin-bottom: 1.25rem; }
.scene { display: block; width: 100%; max-width: 34rem; height: auto; margin: 0 auto; color: var(--ink); overflow: visible; }
.me-box {
  position: relative;
  display: block;
  width: min(100%, 20rem);
  margin: 3.5rem auto 0;
  background: var(--paper);
  color: var(--lit-ink);
  font: inherit;
  text-align: center;
  border: 0;
  border-radius: 6px;
  padding: .9rem .9rem 1.1rem;
  box-shadow: 0 12px 30px rgba(20, 8, 4, .3);
  cursor: pointer;
  transform: rotate(-1deg);
  transition: transform .25s ease;
  -webkit-tap-highlight-color: transparent;
}
.me-box:hover { transform: translateY(-4px) rotate(0); }
.me-box .frame { aspect-ratio: 1; font-size: 2rem; color: var(--accent); }
.me-box .label { display: block; margin-top: .85rem; font-family: var(--display); font-weight: 700; font-size: 1.15rem; line-height: 1.25; }
.me-box::after {
  content: "\2665";
  position: absolute; top: -.7rem; right: -.6rem;
  width: 2.4rem; height: 2.4rem;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #B3273B, #7A1524);
  color: #F3E6C4;
  display: grid; place-items: center;
  font-size: 1.15rem;
  box-shadow: 0 2px 6px rgba(0, 0, 0, .35);
  transition: opacity .3s ease;
}
.me-box.read::after { opacity: .45; }
@media (prefers-reduced-motion: reduce) { .me-box { transition: none; } }
.love-scene { display: block; width: min(100%, 40rem); height: auto; margin: 3.5rem auto 0; color: var(--ink); overflow: visible; }
.love-scene .beat { transform-box: fill-box; transform-origin: 50% 55%; animation: beat 2.6s ease-in-out infinite; }
@keyframes beat { 0%, 100% { transform: scale(1); } 45% { transform: scale(1.025); } 55% { transform: scale(1.01); } }
.together { margin-top: 3rem; text-align: center; }
.together h2 { margin-bottom: 1.25rem; }
.counter { display: flex; flex-wrap: wrap; justify-content: center; gap: .7rem; }
.cnt { background: var(--paper); color: var(--lit-ink); border-radius: 6px; padding: .75rem .4rem .6rem; min-width: 4.7rem; box-shadow: 0 8px 22px rgba(20, 8, 4, .25); }
.cnt b { display: block; font-family: var(--display); font-weight: 700; font-size: 1.9rem; line-height: 1.1; color: var(--accent); }
.cnt span { display: block; font-size: .95rem; }
@media (prefers-reduced-motion: reduce) { .love-scene .beat { animation: none; } }
/* Voice message */
.voice { background: var(--paper); color: var(--lit-ink); max-width: 38rem; margin: 0 auto; padding: 1.4rem 1.3rem; border-radius: 6px; box-shadow: 0 8px 22px rgba(20, 8, 4, .25); }
.voice-row { display: flex; align-items: center; gap: 1rem; }
.play { flex: 0 0 auto; width: 4rem; height: 4rem; border-radius: 50%; border: 0; cursor: pointer; background: radial-gradient(circle at 35% 30%, #B3273B, #7A1524); color: #F3E6C4; font-size: 1.4rem; display: grid; place-items: center; box-shadow: 0 3px 8px rgba(0, 0, 0, .35); -webkit-tap-highlight-color: transparent; }
.play:disabled { opacity: .5; cursor: default; }
.vbar { flex: 1; min-width: 0; }
.vseek { padding: .7rem 0; cursor: pointer; }
.vtrack { height: .7rem; border-radius: 99px; background: rgba(43, 26, 18, .18); overflow: hidden; }
.vfill { height: 100%; width: 0; background: var(--accent); border-radius: 99px; }
.vtime { display: flex; justify-content: space-between; font-size: .95rem; }
.voice-note { margin: 1rem 0 0; text-align: center; font-style: italic; }

/* Quiz */
.quiz { background: var(--paper); color: var(--lit-ink); max-width: 38rem; margin: 0 auto; padding: 1.5rem 1.3rem 1.6rem; border-radius: 6px; box-shadow: 0 8px 22px rgba(20, 8, 4, .25); }
.q-count { font-family: var(--display); font-size: .85rem; color: var(--accent); margin: 0 0 .5rem; }
.q-text { font-family: var(--display); font-weight: 700; font-size: 1.2rem; line-height: 1.3; margin: 0 0 1.1rem; }
.q-opts { display: grid; gap: .6rem; }
.q-opt { font: inherit; text-align: left; width: 100%; background: var(--lit-bg); color: var(--lit-ink); border: 2px solid transparent; border-radius: 6px; padding: .75rem .9rem; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background-color .2s, border-color .2s; }
.q-opt:hover:not(:disabled) { border-color: var(--accent); }
.q-opt:disabled { cursor: default; }
.q-opt.right { background: var(--gold); border-color: #8F6A15; }
.q-opt.wrong { background: #E7B4B4; border-color: var(--accent); }
.q-feedback { min-height: 1.6em; margin: .9rem 0 0; font-style: italic; }
.q-next, .q-again { font: inherit; font-weight: 700; background: var(--accent); color: #F3E6C4; border: 0; border-radius: 999px; padding: .7rem 1.5rem; cursor: pointer; margin-top: .6rem; }
.q-result { text-align: center; }
.q-score { font-family: var(--display); font-weight: 900; font-size: 2.6rem; color: var(--accent); margin: 0 0 .4rem; line-height: 1.1; }

/* Bucket list */
.bucket { background: var(--paper); color: var(--lit-ink); max-width: 38rem; margin: 0 auto; padding: 1.1rem 1.3rem 1.3rem; border-radius: 6px; box-shadow: 0 8px 22px rgba(20, 8, 4, .25); }
.bucket ul { list-style: none; margin: 0; padding: 0; }
.bucket li + li { border-top: 1px dashed rgba(140, 28, 44, .35); }
.bk { position: relative; display: flex; align-items: center; gap: .9rem; padding: .85rem 0; cursor: pointer; }
.bk input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.tick { flex: 0 0 auto; width: 1.7rem; height: 1.7rem; border: 2.5px solid var(--accent); border-radius: 5px; display: grid; place-items: center; color: transparent; font-size: 1rem; line-height: 1; transition: background-color .2s, color .2s, transform .2s; }
.bk input:checked + .tick { background: var(--accent); color: #F3E6C4; transform: scale(1.08); }
.bk input:focus-visible + .tick { outline: 3px solid var(--flame); outline-offset: 3px; }
.bk input:checked ~ .bk-text { opacity: .6; text-decoration: line-through; text-decoration-color: var(--accent); }
.bucket-count { text-align: center; margin: 1rem 0 0; font-style: italic; }

@media (prefers-reduced-motion: reduce) { .q-opt, .tick { transition: none; } }
/* Scratch card */
.scratch { position: relative; width: min(100%, 20rem); aspect-ratio: 4 / 5; margin: 0 auto; background: var(--paper); padding: .6rem; border-radius: 6px; box-shadow: 0 12px 30px rgba(20, 8, 4, .3); transform: rotate(-1deg); }
.scratch-inner { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 3px; background: var(--lit-bg); }
.scratch-inner .under { position: absolute; inset: 0; }
.scratch-inner .under img { width: 100%; height: 100%; object-fit: cover; display: block; }
.scratch-inner .under .frame { height: 100%; aspect-ratio: auto; font-size: 1.1rem; }
.scratch canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; user-select: none; -webkit-user-select: none; transition: opacity .8s ease; }
.scratch canvas.gone { opacity: 0; pointer-events: none; }
.scratch-cap { text-align: center; margin: 1.4rem auto 0; max-width: 30rem; font-style: italic; }

/* Monthly notes */
.mo-intro { text-align: center; margin: 0 0 .9rem; font-style: italic; }
.months-count { margin-bottom: 0; }
.months-count .cnt { min-width: 4.2rem; }
.months { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.1rem; margin-top: 2rem; }
.mo { position: relative; width: calc(50% - .55rem); background: var(--paper); color: var(--lit-ink); font: inherit; text-align: center; border: 0; border-radius: 6px; padding: 1.2rem .6rem 1rem; box-shadow: 0 8px 22px rgba(20, 8, 4, .25); cursor: pointer; transform: rotate(-1.5deg); transition: transform .25s ease; -webkit-tap-highlight-color: transparent; }
.mo:nth-child(even) { transform: rotate(1.5deg); }
.mo:not(.locked):hover { transform: translateY(-4px) rotate(0); }
.mo.locked { opacity: .85; }
.m-name { display: block; font-family: var(--display); font-weight: 700; font-size: 1.05rem; line-height: 1.25; }
.m-state { display: block; margin-top: .4rem; font-size: .95rem; }
.m-ico { position: absolute; top: -.6rem; right: -.5rem; width: 2.2rem; height: 2.2rem; border-radius: 50%; display: grid; place-items: center; font-size: 1.05rem; color: #F3E6C4; box-shadow: 0 2px 6px rgba(0, 0, 0, .35); background: radial-gradient(circle at 35% 30%, #B3273B, #7A1524); transition: opacity .3s ease; }
.mo.locked .m-ico { background: #5B4A3C; }
.mo.read .m-ico { opacity: .45; }
.shake { animation: shake .4s ease; }
@keyframes shake { 0%, 100% { translate: 0; } 25% { translate: -7px; } 75% { translate: 7px; } }
@media (min-width: 52rem) { .mo { width: calc(20% - .9rem); } }

/* Locked final message */
.final-lock { max-width: 24rem; margin: 0 auto; background: var(--paper); color: var(--lit-ink); padding: 1.6rem 1.3rem 1.5rem; border-radius: 6px; box-shadow: 0 12px 30px rgba(20, 8, 4, .3); }
.final-lock.open { max-width: 34rem; }
.final-lock h2 { margin: 0 0 1rem; font-size: clamp(1.3rem, 5vw, 1.7rem); }
.lock-ico { display: block; width: 3.2rem; height: 3.2rem; margin: 0 auto .7rem; color: var(--accent); }
.lock-ico svg { width: 100%; height: 100%; display: block; }
.lock-q { font-family: var(--display); font-weight: 700; font-size: 1.1rem; line-height: 1.3; margin: 0 0 1rem; }
.lock-form { display: grid; gap: .7rem; }
.lock-in { font: inherit; text-align: center; padding: .75rem .9rem; border-radius: 6px; border: 2px solid rgba(140, 28, 44, .4); background: var(--lit-bg); color: var(--lit-ink); width: 100%; }
.lock-in:focus { outline: none; border-color: var(--accent); }
.lock-btn { font: inherit; font-weight: 700; background: var(--accent); color: #F3E6C4; border: 0; border-radius: 999px; padding: .75rem 1.5rem; cursor: pointer; }
.lock-msg { min-height: 1.5em; margin: .8rem 0 0; font-style: italic; }
.final-text { margin: 0; white-space: pre-line; font-style: italic; font-size: 1.2rem; }

<canvas id="confetti" aria-hidden="true"></canvas>

<script>
  /* =====================================================
     EDIT THIS PART. Change the words inside the quotes.
     PHOTOS: upload them to the same place as this file and
     name them photo1, photo2 ... and plushie1 ... plushie8
     (.jpg, .jpeg or .png all work). Until a photo exists,
     you'll see a dashed placeholder telling you its name.
     ===================================================== */
  const CONFIG = {
    name: "Tamara",

    memories: [
      { photo: "photo1", date: "15 June 2025", title: "OUR PROM absolutely aura lowkey..",            text: "THis pic is still lowkey my fav pic of us, what about you?." },
      { photo: "photo2", date: "23 July 2025", title: "The real indian couple",       text: "I couldve put the one where we were on the floor, but this ones better." },
      { photo: "photo3", date: "22 September 2025", title: "ONE year ago today", text: "peppa pig and georgy and daddy and mommy pig, im lowkey matching with george." },
      { photo: "photo4", date: "10 February 2026", title: "I have absolutely no clue what we doing",  text: "We NEED to go there again." },
      { photo: "photo5", date: "15 June 2025", title: "ZAMN you look gorgeous here",         text: "Looking very majestic baby!!." },
      { photo: "photo6", date: "19 July 2026", title: "Youre favorite picture of me",                 text: "HAHAHHAHA." }
    ],

    paragraph: "[Dear Tamara, I want to say you are the most beautiful and wonderful human being i have ever met, i really really love you very very much sayanggku,my cutie patotiee, HAPPY BIRTHDAY!! youre truly my sunshine, Youre turning 20 years old! thats crazy, hope you have a wonderful birthday sayangg, with a lot of love and gifts! Enjoy your harry potter movie night! .]"
  };
  /* ===================================================== */

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  document.title = "Happy Birthday, " + CONFIG.name;
  $('title').textContent = "Make a wish, " + CONFIG.name + ".";

  /* Look for a photo under a few common file endings. Calls back only if one loads. */
  function probe(base, onFound) {
    const exts = ['jpg', 'jpeg', 'png', 'webp', 'JPG', 'JPEG', 'PNG'];
    let i = 0;
    const img = new Image();
    img.onload = () => onFound(img);
    img.onerror = () => { i++; if (i < exts.length) img.src = base + '.' + exts[i]; };
    img.src = base + '.' + exts[0];
  }
  function fillFrame(frame, img, alt) {
    img.alt = alt;
    frame.className = 'frame has-photo';
    frame.replaceChildren(img);
  }

  /* Floating candles */
  const candles = [
    { l: 6, t: 6, s: .8, d: 7.5, w: 0 }, { l: 24, t: 2, s: 1, d: 6.5, w: -2 },
    { l: 47, t: 9, s: .7, d: 8, w: -4 }, { l: 68, t: 3, s: 1.05, d: 7, w: -1 },
    { l: 88, t: 8, s: .85, d: 6.8, w: -3 }, { l: 14, t: 20, s: .6, d: 8.5, w: -5 },
    { l: 82, t: 24, s: .65, d: 7.8, w: -2.5 }
  ];
  $('ceiling').innerHTML = candles.map((c) =>
    `<div class="fc" style="left:${c.l}%;top:${c.t}%;--s:${c.s};--dur:${c.d}s;--del:${c.w}s"><i></i></div>`
  ).join('');

  /* Memory lane */
  const lane = $('lane');
  CONFIG.memories.forEach((m) => {
    const li = document.createElement('li');
    li.innerHTML =
      `<span class="when">${esc(m.date)}</span>` +
      `<h3>${esc(m.title)}</h3>` +
      (m.photo ? `<div class="pola"><div class="frame">${esc(m.photo)}.jpg goes here</div></div>` : '') +
      `<p>${esc(m.text)}</p>`;
    lane.appendChild(li);
    if (m.photo) {
      const frame = li.querySelector('.frame');
      probe(m.photo, (img) => fillFrame(frame, img, m.title));
    }
  });

  /* Fade each memory in as she scrolls */
  if ('IntersectionObserver' in window && !reduce) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('seen'); io.unobserve(e.target); } });
    }, { threshold: 0.2 });
    lane.querySelectorAll('li').forEach((li) => io.observe(li));
  } else {
    lane.querySelectorAll('li').forEach((li) => li.classList.add('seen'));
  }

  $('paragraph').textContent = CONFIG.paragraph;
  $('seal').textContent = CONFIG.name.charAt(0);

  /* Surprise: 8 plushie frames around a cake (plushie1 ... plushie8) */
  $('big').innerHTML = `<span>Happy</span><span>Birthday</span><span class="who">Mommy!!</span>`;
  const ring = $('ring');
  for (let n = 1; n <= 8; n++) {
    if (n === 5) {
      const b = document.createElement('button');
      b.className = 'cake mid';
      b.type = 'button';
      b.setAttribute('aria-label', 'More confetti');
      b.innerHTML = $('cakeTpl').innerHTML;
      b.addEventListener('click', () => burst(0.55));
      ring.appendChild(b);
    }
    const mini = document.createElement('div');
    mini.className = 'mini';
    const frame = document.createElement('div');
    frame.className = 'frame';
    frame.innerHTML = '&#10022;';
    mini.appendChild(frame);
    ring.appendChild(mini);
    probe('plushie' + n, (img) => fillFrame(frame, img, 'A plushie'));
  }

  /* Confetti */
  let raf = 0;
  function burst(fromY) {
    if (reduce) return;
    cancelAnimationFrame(raf);
    const c = $('confetti');
    const ctx = c.getContext('2d');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = window.innerWidth, H = window.innerHeight;
    c.width = W * dpr; c.height = H * dpr;
    ctx.scale(dpr, dpr);
    const colors = ['#FFB627', '#D9A93A', '#B3273B', '#F3E6C4', '#7A9CD6', '#FFFFFF'];
    const parts = Array.from({ length: 170 }, () => ({
      x: W / 2, y: H * (fromY || 0.5),
      vx: (Math.random() - 0.5) * 16,
      vy: -(6 + Math.random() * 11),
      w: 6 + Math.random() * 6,
      h: 10 + Math.random() * 8,
      r: Math.random() * 6.28,
      vr: (Math.random() - 0.5) * 0.3,
      col: colors[Math.floor(Math.random() * colors.length)]
    }));
    const start = performance.now();
    (function frame(now) {
      ctx.clearRect(0, 0, W, H);
      parts.forEach((p) => {
        p.vy += 0.26; p.vx *= 0.99; p.vy *= 0.995;
        p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.r);
        ctx.fillStyle = p.col;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
      if (now - start < 4200) raf = requestAnimationFrame(frame);
      else ctx.clearRect(0, 0, W, H);
    })(start);
  }

  /* Blow out the candles */
  let lit = false;
  $('cake').addEventListener('click', () => {
    if (lit) return;
    lit = true;
    document.documentElement.classList.add('lit');
    $('cake').setAttribute('aria-label', 'Candles blown out');
    $('reveal').hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => $('reveal').classList.add('in')));
    burst(0.5);
    setTimeout(() => {
      if (window.scrollY < 40) {
        $('reveal').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
      }
    }, 2600);
  });

  /* Cupcake opens the surprise */
  let opened = false;
  $('cupcake').addEventListener('click', () => {
    if (opened) return;
    opened = true;
    const cup = $('cupcake');
    cup.classList.add('gone');
    setTimeout(() => {
      cup.style.display = 'none';
      const s = $('surprise');
      s.hidden = false;
      requestAnimationFrame(() => requestAnimationFrame(() => s.classList.add('open')));
      burst(0.5);
      setTimeout(() => s.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }), 300);
    }, reduce ? 0 : 300);
  });
/* Side pictures that pop up beside the memory lane */
['left', 'right'].forEach((side) => {
  probe('side-' + side, (img) => {
    img.className = 'side side-' + side;
    img.alt = '';
    img.setAttribute('aria-hidden', 'true');
    document.body.appendChild(img);
    if ('IntersectionObserver' in window) {
      new IntersectionObserver((entries) => {
        entries.forEach((e) => img.classList.toggle('on', e.isIntersecting));
      }, { threshold: 0 }).observe(lane);
    } else {
      img.classList.add('on');
    }
  });
});
/* Floating hearts around the cupcake and plushie frames */
(function () {
  const finish = $('finish');
  const layer = document.createElement('div');
  layer.className = 'hearts';
  layer.setAttribute('aria-hidden', 'true');

    new IntersectionObserver((entries) => {
      entries.forEach((e) => (e.isIntersecting ? start() : stop()));
    }, { threshold: 0 }).observe(finish);

  ];

    audio.appendChild(s);
  });
  audio.lastChild.addEventListener('error', () => {
    note.textContent = 'Your voice message goes here. Upload it as voice.m4a or voice.mp3.';
  });

  const fmt = (t) => {
    if (!isFinite(t)) return '0:00';
    const m = Math.floor(t / 60), s = Math.floor(t % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  };
  audio.addEventListener('loadedmetadata', () => { btn.disabled = false; total.textContent = fmt(audio.duration); });
  audio.addEventListener('timeupdate', () => {
    now.textContent = fmt(audio.currentTime);
    fill.style.width = (audio.duration ? (audio.currentTime / audio.duration) * 100 : 0) + '%';
  });
  audio.addEventListener('play', () => { btn.innerHTML = '&#10074;&#10074;'; btn.setAttribute('aria-label', 'Pause the message'); });
  audio.addEventListener('pause', () => { btn.innerHTML = '&#9654;'; btn.setAttribute('aria-label', 'Play the message'); });

    const r = e.currentTarget.getBoundingClientRect();

      '<div class="q-opts">' + q.options.map((o, k) =>
        '<button class="q-opt" type="button" data-k="' + k + '">' + esc(o) + '</button>').join('') + '</div>' +
      '<p class="q-feedback" aria-live="polite"></p><div class="q-nav"></div>';
    const opts = Array.from(box.querySelectorAll('.q-opt'));
    opts.forEach((b) => b.addEventListener('click', () => {
      const k = Number(b.dataset.k);
      opts.forEach((o) => { o.disabled = true; });
      if (opts[q.answer]) opts[q.answer].classList.add('right');
      const fb = box.querySelector('.q-feedback');
      if (k === q.answer) { score++; fb.textContent = QUIZ.yes; }
      else { b.classList.add('wrong'); fb.textContent = QUIZ.no; }
      const nb = document.createElement('button');
      nb.type = 'button';
      nb.className = 'q-next';
      nb.textContent = i === total - 1 ? 'See my score' : 'Next question';
      nb.addEventListener('click', () => { i++; render(); });
      box.querySelector('.q-nav').appendChild(nb);
    }));
  }

  function result() {
    const pct = score / total;
    const msg = pct >= 0.8 ? QUIZ.endings.great : pct >= 0.4 ? QUIZ.endings.ok : QUIZ.endings.low;
    box.innerHTML =
      '<div class="q-result"><p class="q-score">' + score + ' / ' + total + '</p>' +
      '<p>' + esc(msg) + '</p><button class="q-again" type="button">Play again</button></div>';
    box.querySelector('.q-again').addEventListener('click', () => { i = 0; score = 0; render(); });
    burst(0.6);
  }
  render();
})();

/* ---------- Scratch card ---------- */
(function () {
  /* ===== EDIT THIS PART ===== */
  const SCRATCH = {
    heading: "Scratch to reveal something amazing and aura...",
    text: "Scratch here lovee!",     /* the words on the gold foil */
    photo: "dragon",          /* your file: dragon.PNG (leave off the ending) */
    caption: ""               /* optional line that appears after she reveals it */
  };
  /* ========================== */

  const sec = makeSection(SCRATCH.heading);
  sec.insertAdjacentHTML('beforeend',
    '<div class="scratch"><div class="scratch-inner">' +
    '<div class="under"><div class="frame">' + esc(SCRATCH.photo) + '.PNG goes here</div></div>' +
    '<canvas tabindex="0" aria-label="Scratch card. Press Enter to reveal what is underneath."></canvas>' +
    '</div></div><p class="scratch-cap"></p>');
  $('finish').parentNode.insertBefore(sec, $('finish'));

  const inner = sec.querySelector('.scratch-inner');
  const under = sec.querySelector('.under');
  const cv = sec.querySelector('canvas');
  const cap = sec.querySelector('.scratch-cap');
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  probe(SCRATCH.photo, (img) => { img.alt = 'The surprise'; under.replaceChildren(img); });

  let inited = false, touched = false, drawing = false, done = false, last = null, lastCheck = 0;

  function paint(w, h, dpr) {
    const g = ctx.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, '#D9B24B'); g.addColorStop(.35, '#F3DE9A'); g.addColorStop(.6, '#C9982F'); g.addColorStop(1, '#E8CB6E');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 420; i++) {
      ctx.fillStyle = Math.random() < .5 ? 'rgba(255,255,255,.28)' : 'rgba(90,60,10,.18)';
      ctx.beginPath();
      ctx.arc(Math.random() * w, Math.random() * h, (Math.random() * 1.6 + .4) * dpr, 0, 6.283);
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(60,35,10,.7)';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '700 ' + Math.round(w * 0.085) + 'px "Cinzel Decorative", Georgia, serif';
    ctx.fillText(SCRATCH.text, w / 2, h / 2 - w * 0.05);
    ctx.font = Math.round(w * 0.12) + 'px Georgia, serif';
    ctx.fillText('\u2665', w / 2, h / 2 + w * 0.11);
  }
  function setup() {
    if (done) return;
    if (!inner.clientWidth || !inner.clientHeight) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(inner.clientWidth * dpr);
    cv.height = Math.round(inner.clientHeight * dpr);
    ctx.globalCompositeOperation = 'source-over';
    paint(cv.width, cv.height, dpr);
    inited = true;
  }
  const ready = document.fonts ? document.fonts.ready : Promise.resolve();
  function ensure() { if (!inited) ready.then(() => { if (!inited) setup(); }); }

  if ('IntersectionObserver' in window) {
    new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) ensure(); });
    }, { threshold: 0 }).observe(inner);
  }
  window.addEventListener('resize', () => { if (inited && !touched && !done) setup(); });

  function point(e) {
    return { x: e.offsetX * cv.width / cv.clientWidth, y: e.offsetY * cv.height / cv.clientHeight };
  }
  function scratchTo(p) {
    const brush = cv.width * 0.12;
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = brush;
    ctx.beginPath();
    if (last) { ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); }
    else { ctx.arc(p.x, p.y, brush / 2, 0, 6.283); ctx.fill(); }
    last = p;
  }
  function progress() {
    const d = ctx.getImageData(0, 0, cv.width, cv.height).data;
    let clear = 0, n = 0;
    for (let i = 3; i < d.length; i += 160) { n++; if (d[i] < 128) clear++; }
    return clear / n;
  }
  function reveal() {
    if (done) return;
    done = true;
    cv.classList.add('gone');
    setTimeout(() => { cv.style.display = 'none'; }, 900);
    burst(0.5);
    if (SCRATCH.caption) cap.textContent = SCRATCH.caption;
  }

  cv.addEventListener('pointerdown', (e) => {
    if (done) return;
    if (!inited) setup();
    if (!inited) return;
    touched = true; drawing = true; last = null;
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    scratchTo(point(e));
    e.preventDefault();
  });
  cv.addEventListener('pointermove', (e) => {
    if (!drawing || done) return;
    scratchTo(point(e));
    const t = performance.now();
    if (t - lastCheck > 250) { lastCheck = t; if (progress() > 0.5) reveal(); }
  });
  const stop = () => { drawing = false; last = null; if (touched && !done && progress() > 0.5) reveal(); };
  cv.addEventListener('pointerup', stop);
  cv.addEventListener('pointercancel', stop);
  cv.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); reveal(); } });
})();

/* ---------- Monthly notes ---------- */
(function () {
  /* ===== EDIT THIS PART =====
     unlock is when the note opens: year-month-day, then T, then hour:minute:second (24-hour).
     It uses the clock on her phone. */
  const MONTHLY = {
    heading: "One message from yours truly every month... Its goof trust me!",
    intro: "The next message opens in",
    allOpen: "Every note is open now.",
    notes: [
      { label: "October",  unlock: "2026-10-01T00:00:00", message: "[Write your October note here.]" },
      { label: "November", unlock: "2026-11-01T00:00:00", message: "[Write your November note here.]" },
      { label: "December", unlock: "2026-12-01T00:00:00", message: "[Write your December note here.]" },
      { label: "January",  unlock: "2027-01-01T00:00:00", message: "[Write your January note here.]" },
      { label: "February", unlock: "2027-02-01T00:00:00", message: "[Write your February note here.]" }
    ]
  };
  /* ========================== */

  const lockSvg = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';

  const sec = makeSection(MONTHLY.heading);
  sec.insertAdjacentHTML('beforeend', '<p class="mo-intro"></p><div class="counter months-count"></div><div class="months"></div>');
  $('finish').parentNode.insertBefore(sec, $('finish'));
  const intro = sec.querySelector('.mo-intro');
  const counter = sec.querySelector('.months-count');
  const grid = sec.querySelector('.months');

  const dlg = document.createElement('dialog');
  dlg.className = 'note-dialog';
  dlg.innerHTML =
    '<div class="note"><button class="note-close" type="button" aria-label="Close">&times;</button>' +
    '<div class="note-body"><h3></h3><p></p></div></div>';
  document.body.appendChild(dlg);
  const dTitle = dlg.querySelector('h3');
  const dMsg = dlg.querySelector('.note-body p');
  const close = () => (dlg.close ? dlg.close() : dlg.removeAttribute('open'));
  dlg.querySelector('.note-close').addEventListener('click', close);
  dlg.addEventListener('click', (e) => { if (e.target === dlg) close(); });

  const cards = MONTHLY.notes.map((n) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'mo locked';
    b.innerHTML = '<span class="m-ico"></span><span class="m-name">' + esc(n.label) + '</span><span class="m-state"></span>';
    grid.appendChild(b);
    b.addEventListener('click', () => {
      if (b.classList.contains('locked')) {
        b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
        return;
      }
      dTitle.textContent = n.label;
      dMsg.textContent = n.message || '';
      if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
      b.classList.add('read');
    });
    return b;
  });

  function update() {
    const now = Date.now();
    let next = null;
    MONTHLY.notes.forEach((n, i) => {
      const t = +new Date(n.unlock);
      const open = now >= t;
      const el = cards[i];
      if (el.dataset.open !== String(open)) {
        el.dataset.open = String(open);
        el.classList.toggle('locked', !open);
        el.querySelector('.m-ico').innerHTML = open ? '&#9829;' : lockSvg;
        const day = new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'long' });
        el.querySelector('.m-state').textContent = open ? 'Tap to open' : 'Opens ' + day;
        el.setAttribute('aria-label', n.label + (open ? ' note, tap to open' : ' note, locked until ' + day));
      }
      if (!open && (next === null || t < next)) next = t;
    });
    if (next === null) {
      intro.textContent = MONTHLY.allOpen;
      counter.innerHTML = '';
    } else {
      const ms = next - now;
      const parts = [
        [Math.floor(ms / 864e5), 'day', 'days'],
        [Math.floor(ms % 864e5 / 36e5), 'hour', 'hours'],
        [Math.floor(ms % 36e5 / 6e4), 'minute', 'minutes'],
        [Math.floor(ms % 6e4 / 1e3), 'second', 'seconds']
      ];
      intro.textContent = MONTHLY.intro;
      counter.innerHTML = parts.map((p) =>
        '<div class="cnt"><b>' + p[0] + '</b><span>' + (p[0] === 1 ? p[1] : p[2]) + '</span></div>').join('');
    }
  }
  update();
  setInterval(update, 1000);
})();

/* ---------- Locked final message ---------- */
(function () {
  /* ===== EDIT THIS PART =====
     answers: every way she might type it. Capitals, spaces and punctuation don't matter,
     so "15 July 2025" and "15/07/2025" both need their own entry, but "15 july 2025" and "15 July, 2025" don't. */
  const FINAL = {
    heading: "One last last thing",
    question: "This is an extremely hard question, what color was the green dinosaur toy we got on our first date after we went to the arcade at pim?",
    answers: ["green", "Green"],
    hint: "Its the colour of my hawaiian shirt...",                                   /* optional, shows after 2 wrong tries */
    wrong: "Think really hard...",
    message: "CORRECT! I LOVEEE YOU SAYANGG, Once again happy birthdayy! and i hope you enjoyed this little goofy website thing i made for you!! MWAH MWAH MWAHHH"
  };
  /* ========================== */

  const closed = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2" fill="currentColor" fill-opacity=".15"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
  const opened = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2" fill="currentColor" fill-opacity=".15"/><path d="M8 11V8a4 4 0 0 1 7.6-1.7"/></svg>';

  const sec = document.createElement('section');
  sec.className = 'block';
  sec.innerHTML =
    '<div class="final-lock"><span class="lock-ico">' + closed + '</span>' +
    '<h2>' + esc(FINAL.heading) + '</h2>' +
    '<p class="lock-q">' + esc(FINAL.question) + '</p>' +
    '<form class="lock-form" autocomplete="off">' +
    '<input class="lock-in" type="text" aria-label="Your answer" autocomplete="off" autocapitalize="off" spellcheck="false">' +
    '<button class="lock-btn" type="submit">Unlock</button></form>' +
    '<p class="lock-msg" aria-live="polite"></p></div>';
  $('surprise').appendChild(sec);

  const wrap = sec.querySelector('.final-lock');
  const input = sec.querySelector('.lock-in');
  const msg = sec.querySelector('.lock-msg');
  const norm = (s) => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');
  let tries = 0;

  sec.querySelector('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const v = norm(input.value);
    if (v && FINAL.answers.some((a) => norm(a) === v)) {
      wrap.classList.add('open');
      wrap.innerHTML =
        '<span class="lock-ico">' + opened + '</span><h2>' + esc(FINAL.heading) + '</h2><p class="final-text"></p>';
      wrap.querySelector('.final-text').textContent = FINAL.message;
      burst(0.5);
    } else {
      tries++;
      msg.textContent = FINAL.wrong + (tries >= 2 && FINAL.hint ? ' Hint: ' + FINAL.hint : '');
      wrap.classList.remove('shake'); void wrap.offsetWidth; wrap.classList.add('shake');
    }
  });
})();
